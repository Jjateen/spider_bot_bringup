services:
  big_bertha_sim:
    build: .
    image: big_bertha_sim:latest
    container_name: big_bertha_sim
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
      - FASTRTPS_DEFAULT_PROFILES_FILE=/etc/ros/fastdds.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/home/ros/spider_bot_bringup/src:rw
      - ./fastdds_docker.xml:/etc/ros/fastdds.xml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]