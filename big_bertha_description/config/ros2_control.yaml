# ros2_control under gz_ros2_control: joint_state_broadcaster + a synchronous
# effort-PD (JointEffortPdController) emulating the Isaac implicit actuator.
# PD in the controller_manager loop reads q/qd with zero latency; the same PD
# over a topic damps stale velocity -> jitter.
controller_manager:
  ros__parameters:
    # Match the gz physics rate. Stability ratio kp*dt^2/I ceiling is ~1.4;
    # the v1.0.0 mass correction pushed 500 Hz past it (calf chatter), 1000 Hz
    # restores margin. Policy stays 50 Hz via decimation.
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: big_bertha_controllers/JointEffortPdController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

position_controller:
  ros__parameters:
    # MUST match the deployed policy's Isaac actuator (stiffness=20, damping=2).
    kp: 20.0
    kd: 2.0
    effort_limit: 1.18   # N*m stall (MG995 @6.6V, 12 kgf-cm)
    # 0 disables the over-speed cutoff: it was a band-aid for the pre-armature
    # calf resonance and CAPPED top speed (0.150 vs 0.185 m/s at cmd 0.3).
    # Isaac has no such cutoff; the code stays gated on velocity_limit>0.
    velocity_limit: 0.0
    # ORDER = Isaac articulation order (hips, knees, ankles); numeric Revolute
    # order scrambles the command array. See policy.yaml.
    joints:
      - Revolute_110   # hip  leg1
      - Revolute_113   # hip  leg2
      - Revolute_116   # hip  leg3
      - Revolute_119   # hip  leg4
      - Revolute_111   # knee leg1
      - Revolute_114   # knee leg2
      - Revolute_117   # knee leg3
      - Revolute_120   # knee leg4
      - Revolute_112   # ankle leg1
      - Revolute_115   # ankle leg2
      - Revolute_118   # ankle leg3
      - Revolute_121   # ankle leg4
    default_positions:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
