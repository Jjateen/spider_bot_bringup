# ros2_control configuration for Big Bertha under gz_ros2_control.
#
# Loaded by the gz_ros2_control system plugin (declared in
# urdf/big_bertha.ros2_control.xacro). Spawns:
#   - joint_state_broadcaster -> /joint_states (position + velocity)
#   - position_controller     -> JointEffortPdController
#     (subscribes /position_controller/commands = 12 position targets)
#
# The controller runs a synchronous effort-PD at update_rate, emulating the
# Isaac Lab implicit actuator (stiffness=20, damping=2) the policy trained
# against. Computing the PD here -- in the controller_manager loop, reading
# q/qd with zero latency -- is what removes the jitter; the same PD done in
# the policy node and shipped over a topic damps against stale velocity.
#
# Joint order matches the policy contract: Revolute_110 .. Revolute_121.
controller_manager:
  ros__parameters:
    # Match the gz physics rate (1000 Hz). gz_ros2_control runs the controller
    # once per physics step, so the explicit effort-PD updates at this rate,
    # where kp*dt^2/I is the stability ratio (~1.4 is the observed ceiling).
    # 500 Hz (ratio ~0.92) was stable for the ORIGINAL calf inertia; the
    # v1.0.0 mass correction (real CAD mass, ~half the old placeholder) raised
    # ratio to ~1.74 for that same rate since inertia dropped by the same
    # factor, crossing the ceiling and making the calf/foot joints chatter at
    # their velocity limit every tick regardless of PD kd or contact
    # softness. 1000 Hz (ratio ~0.43) restores a comfortable margin. The
    # policy stays at 50 Hz (decimated in the node), so gait timing is
    # unchanged. See worlds/obstacle_world.sdf.
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: big_bertha_controllers/JointEffortPdController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

position_controller:
  ros__parameters:
    # These MUST match the deployed policy's Isaac actuator. The deployed
    # policy is the retrained run big_bertha/2026-06-11_10-00-20, whose env.yaml
    # actuator is stiffness=20, damping=2, effort_limit_sim=1.0,
    # velocity_limit_sim=5.55.
    kp: 20.0            # position stiffness (Isaac stiffness=20)
    kd: 2.0             # velocity damping  (Isaac damping=2)
    effort_limit: 1.18   # N*m stall (MG995 @6.6V, 12 kgf-cm)
    # velocity_limit=0 DISABLES the over-speed torque cutoff. It was a band-aid
    # for the pre-armature calf resonance (joints flinging to ~19 rad/s); with
    # the calf armature now in the URDF the joints stay bounded on their own
    # (peak ~5.9 rad/s even under a vx=0.3 command), so the cutoff is no longer
    # needed -- and it was CAPPING top speed (vx=0.3 tracked 0.150 m/s with it,
    # 0.185 without, vs Isaac's 0.273). Isaac's IdealPDActuator has no such
    # cutoff either, so removing it is also the more faithful match. The cutoff
    # code stays (gated on velocity_limit>0) for future policies that need it.
    velocity_limit: 0.0   # 0 = no over-speed cutoff (armature bounds joints)
    # ORDER MUST match the policy controller's joint_names (Isaac articulation
    # order: all hips, all knees, all ankles) so the incoming 12-element command
    # array indexes the same joints the policy produced. Numeric Revolute order
    # scrambles obs/actions and collapses the gait. See
    # big_bertha_policy_controller/config/policy.yaml.
    joints:
      - Revolute_110   # hip  leg1
      - Revolute_113   # hip  leg2
      - Revolute_116   # hip  leg3
      - Revolute_119   # hip  leg4
      - Revolute_111   # knee leg1
      - Revolute_114   # knee leg2
      - Revolute_117   # knee leg3
      - Revolute_120   # knee leg4
      - Revolute_112   # ankle leg1
      - Revolute_115   # ankle leg2
      - Revolute_118   # ankle leg3
      - Revolute_121   # ankle leg4
    default_positions:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
