# ros2_control under gz_ros2_control: joint_state_broadcaster + a synchronous
# effort-PD (JointEffortPdController) emulating the Isaac implicit actuator.
# PD in the controller_manager loop reads q/qd with zero latency; the same PD
# over a topic damps stale velocity -> jitter.
controller_manager:
  ros__parameters:
    # Match the gz physics rate. Stability ratio kp*dt^2/I ceiling is ~1.4;
    # the v1.0.0 mass correction pushed 500 Hz past it (calf chatter), 1000 Hz
    # restores margin. Policy stays 50 Hz via decimation.
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: big_bertha_controllers/JointEffortPdController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false

position_controller:
  ros__parameters:
    # MUST match the deployed policy's Isaac actuator (stiffness=20, damping=2).
    # kp 45, not Isaac's 20. Isaac's number assumes its solver; DART's explicit
    # effort-PD sags further under the same gain, and the sag ate the swing
    # clearance: measured foot lift apex was 38/22/6/15 mm, so one foot lifted
    # 6 mm and simply dragged, which is the leg that looked like it was kicking.
    # At 45 the apexes are 38/35/34/27 mm against Isaac's 32/35/16/18, i.e. all
    # four feet clear. It costs forward speed (0.107 -> 0.072 m/s) because
    # stiffer legs slip more (ratio 5.4 -> 8.4); the clearance is worth more
    # than the speed here, since a dragging foot is what reads as broken.
    kp: 45.0
    kd: 2.0
    # 1.18 (MG995 @6.6V stall) > the trained 1.0 Nm is DELIBERATE: A/B on the
    # straight walk measured 1.18 faster at both speeds (0.138 vs 0.132 m/s at
    # cmd 0.12; 0.164 vs 0.145 at cmd 0.30) -- the headroom offsets DART's
    # contact losses. Not train/deploy drift.
    effort_limit: 1.18
    # Torque-speed curve matching training's DCMotor actuator: stall torque at
    # zero speed falling linearly to zero at the no-load speed. The sim servo
    # used to deliver full torque at any speed, which a policy trained against
    # the real curve cannot exploit (measured: -18% top speed for such a
    # policy). Set saturation_effort 0 to fall back to the old hard cutoff.
    velocity_limit: 7.2      # rad/s no-load (MG995 @6.6V)
    saturation_effort: 1.18  # N*m stall
    # ORDER = Isaac articulation order (hips, knees, ankles); numeric Revolute
    # order scrambles the command array. See policy.yaml.
    joints:
      - Revolute_110   # hip  leg4 (back-left)
      - Revolute_113   # hip  leg1 (front-left)
      - Revolute_116   # hip  leg2 (front-right)
      - Revolute_119   # hip  leg3 (back-right)
      - Revolute_111   # knee leg4 (back-left)
      - Revolute_114   # knee leg1 (front-left)
      - Revolute_117   # knee leg2 (front-right)
      - Revolute_120   # knee leg3 (back-right)
      - Revolute_112   # ankle leg4 (back-left)
      - Revolute_115   # ankle leg1 (front-left)
      - Revolute_118   # ankle leg2 (front-right)
      - Revolute_121   # ankle leg3 (back-right)
    default_positions:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
