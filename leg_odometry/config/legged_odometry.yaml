# ORDER MUST match the policy controller's Isaac articulation order (all hips, then
# all knees, then all ankles), NOT numeric Revolute_110..121. The policy publishes
# 12 position targets indexed in Isaac group order; the leg odometry subscribes
# to the same topic and publishes /joint_states with matching names so the policy
# reads back correct joint_pos - default_joint_pos in its observation. See
# big_bertha_policy_controller/config/policy.yaml.
#
# On hardware leg_odometry is the SOLE /joint_states publisher (publish_joint_states
# defaults to true): its EWMA simulates the MG995 lag, which is the feedback the
# policy needs. hardware_bridge_node no longer publishes /joint_states at all, so
# the two never collide.
/**:
  ros__parameters:
    joint_names:
      - "Revolute_110"   # hip leg4 (back-left)
      - "Revolute_113"   # hip leg1 (front-left)
      - "Revolute_116"   # hip leg2 (front-right)
      - "Revolute_119"   # hip leg3 (back-right)
      - "Revolute_111"   # knee leg4 (back-left)
      - "Revolute_114"   # knee leg1 (front-left)
      - "Revolute_117"   # knee leg2 (front-right)
      - "Revolute_120"   # knee leg3 (back-right)
      - "Revolute_112"   # ankle leg4 (back-left)
      - "Revolute_115"   # ankle leg1 (front-left)
      - "Revolute_118"   # ankle leg2 (front-right)
      - "Revolute_121"   # ankle leg3 (back-right)
    default_joint_pos:
      [0.0, 0.0, 0.0, 0.0, -0.32, -0.32, -0.32, -0.32, 2.00, 2.00, 2.00, 2.00]
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: false
    velocity_source: "imu_dead_reckon"
    # Cap on the dead-reckoned speed. One IMU sample at dt ~0.29 s with the
    # ~1.7 m/s^2 residual bias injects ~0.5 m/s of pure error, and ZUPT only
    # clears that once the robot stops. The policy tops out near 0.3 m/s.
    # Replaces drift_damping, which sat here but was never applied in
    # compute_imu_dead_reckon; switching it on instead would bleed steady
    # walking velocity, which is why ZUPT replaced it in the first place.
    max_dead_reckon_speed: 0.32
    # ZUPT (Zero-Velocity Update): when the robot is stationary (all joints
    # still + no linear acceleration), reset the dead-reckon velocity to zero.
    # This replaces the old leaky-damping mechanism for drift control —
    # damping bled steady walking velocity to zero; ZUPT only resets when the
    # robot is actually not moving, preserving velocity during walking.
    stationary_joint_vel_threshold: 0.02   # rad/s per joint
    # Real IMU accel magnitude at rest is 11.07 vs 9.81 (see hardware_bridge.yaml),
    # and the boot-time bias calibration leaves a residual that varies run-to-run
    # (measured 0.03-1.7 m/s^2), so a tight 0.5 gate blocks ZUPT and idle odom
    # drifts. 2.0 still rejects real motion while tolerating the calibration
    # variance. The joints_still gate (below) is the primary stationary signal.
    stationary_accel_threshold: 2.0        # m/s^2 deviation from 1g
    # How long everything has to stay still before ZUPT engages, in SECONDS.
    # This used to be a sample count (10), which silently scaled with whatever
    # rate the IMU arrived at: 80 ms at the designed 125 Hz, but 2.9 s at the
    # ~3.5 Hz the bridge actually delivers under load, which is longer than most
    # stops last, so ZUPT never engaged and idle odom drifted anyway.
    stationary_hold_s: 0.4
    # Servo dynamics model: EWMA time constant (seconds) matching MG995 response.
    # tau=0.06 limits filtered position rate to ~6.5 rad/s (servo's max speed),
    # preventing the positive-feedback loop from synthetic joint states.
    servo_tau: 0.06
    # High-pass leak on the specific force (s): rejects a slow DC bias (e.g. from
    # a tilted IMU calibration) so it cannot integrate into runaway /odom drift.
    # 0 disables. 10 s is slow enough that gait acceleration (period ~1.5 s) passes.
    bias_leak_tau: 10.0
