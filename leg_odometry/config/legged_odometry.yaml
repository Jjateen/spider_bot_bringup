# ORDER MUST match the policy controller's Isaac articulation order (all hips, then
# all knees, then all ankles), NOT numeric Revolute_110..121. The policy publishes
# 12 position targets indexed in Isaac group order; the leg odometry subscribes
# to the same topic and publishes /joint_states with matching names so the policy
# reads back correct joint_pos - default_joint_pos in its observation. See
# big_bertha_policy_controller/config/policy.yaml.
#
# On hardware leg_odometry is the SOLE /joint_states publisher (publish_joint_states
# defaults to true): its EWMA simulates the MG995 lag, which is the feedback the
# policy needs. hardware_bridge_node no longer publishes /joint_states at all, so
# the two never collide.
/**:
  ros__parameters:
    joint_names:
      - "Revolute_110"   # hip leg4 (back-left)
      - "Revolute_113"   # hip leg1 (front-left)
      - "Revolute_116"   # hip leg2 (front-right)
      - "Revolute_119"   # hip leg3 (back-right)
      - "Revolute_111"   # knee leg4 (back-left)
      - "Revolute_114"   # knee leg1 (front-left)
      - "Revolute_117"   # knee leg2 (front-right)
      - "Revolute_120"   # knee leg3 (back-right)
      - "Revolute_112"   # ankle leg4 (back-left)
      - "Revolute_115"   # ankle leg1 (front-left)
      - "Revolute_118"   # ankle leg2 (front-right)
      - "Revolute_121"   # ankle leg3 (back-right)
    default_joint_pos:
      [0.0, 0.0, 0.0, 0.0, -0.32, -0.32, -0.32, -0.32, 2.00, 2.00, 2.00, 2.00]
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: false
    velocity_source: "imu_dead_reckon"
    # Cap on the dead-reckoned speed. One IMU sample at dt ~0.29 s with the
    # ~1.7 m/s^2 residual bias injects ~0.5 m/s of pure error, and ZUPT only
    # clears that once the robot stops. The policy tops out near 0.3 m/s.
    # Replaces drift_damping, which sat here but was never applied in
    # compute_imu_dead_reckon; switching it on instead would bleed steady
    # walking velocity, which is why ZUPT replaced it in the first place.
    max_dead_reckon_speed: 0.32
    # ZUPT (Zero-Velocity Update): when the robot is stationary (all joints
    # still + no linear acceleration), reset the dead-reckon velocity to zero.
    # This replaces the old leaky-damping mechanism for drift control —
    # damping bled steady walking velocity to zero; ZUPT only resets when the
    # robot is actually not moving, preserving velocity during walking.
    stationary_joint_vel_threshold: 0.02   # rad/s per joint
    # Real IMU accel magnitude at rest is 11.07 vs 9.81 (see hardware_bridge.yaml),
    # and the boot-time bias calibration leaves a residual that varies run-to-run
    # (measured 0.03-1.7 m/s^2), so a tight 0.5 gate blocks ZUPT and idle odom
    # drifts. 2.0 still rejects real motion while tolerating the calibration
    # variance. The joints_still gate (below) is the primary stationary signal.
    stationary_accel_threshold: 2.0        # m/s^2 deviation from 1g
    # How long everything has to stay still before ZUPT engages, in SECONDS.
    # This used to be a sample count (10), which silently scaled with whatever
    # rate the IMU arrived at: 80 ms at the designed 125 Hz, but 2.9 s at the
    # ~3.5 Hz the bridge actually delivers under load, which is longer than most
    # stops last, so ZUPT never engaged and idle odom drifted anyway.
    stationary_hold_s: 0.4
    # Servo dynamics model: EWMA time constant (seconds) approximating MG995
    # response, used ONLY to synthesize /joint_states feedback for the policy
    # (see legged_odometry_node.cpp on_cmd()). This is a SEPARATE model from
    # the one that actually drives the servo: hardware_bridge's
    # servo_converter.hpp derives an effective tau of ~0.0896s from
    # smoothing_alpha=0.2 @ command_rate_hz=50 (see hardware_bridge.yaml),
    # AND additionally applies a 3.0 rad/s slew limiter that this model has
    # no equivalent of at all.
    #
    # 0.06 was sized off the servo's raw max-speed spec (6.54 rad/s), not off
    # what the command chain in front of it actually delivers. That makes this
    # feedback converge FASTER than the real chain: on a real gait cycle
    # (Revolute_117, walk-0.29ms-current-config bag), this model reaches each
    # peak/trough measurably earlier than both the modeled hardware delivery
    # and Isaac's own trained-against physics response -- see
    # docs/servo_tau_mismatch.png. The policy is trained on feedback shaped by
    # Isaac's physics lag; feeding it a faster, decoupled model on hardware
    # tells it "the leg already arrived" before it physically has, which can
    # trigger the next phase transition (e.g. swing->stance) early.
    #
    # Raised to match hardware_bridge's effective tau, so /joint_states
    # reflects (approximately) what the servo is actually doing rather than
    # an independently-guessed number.
    servo_tau: 0.0896
    # Ankle ("calf") joints -- indices 8-11, the only joints that touch the
    # ground -- get their own tau instead of sharing servo_tau above. An
    # offline resimulation sweep against a recorded yaw-sweep bag measured
    # "floor dwell" (% of time each joint sits within 5% of its own
    # range-minimum) against Isaac ground truth: at the shared servo_tau,
    # hip/knee were already close to Isaac (gap ~1-2pt), but ankle was not --
    # front-left modeled 43.6% vs Isaac's actual 1.3%, front-right 33.2% vs
    # 4.1%, back-right 84.3% vs 17.7%. Isaac's real ankle response is shaped
    # by stance-phase ground contact (foot planted, load resisting motion)
    # that this feedforward command-follower has no signal for -- raising
    # servo_tau globally to compensate made hip/knee worse (their dwell
    # dropped toward 0% vs their own true 1-10%), which is why this needed a
    # separate parameter rather than one shared retune.
    #
    # 0.28 is the sweep optimum trading the floor-dwell gap against the
    # cross-correlation lag metric from the prior servo_tau tuning pass (see
    # docs/servo_tau_mismatch.png) -- see docs/ankle_tau_dwell_sweep.png for
    # the full grid. Back-left/back-right keep a residual gap (30pt / 47.4pt)
    # that no tau/rate combination in the sweep closed: that's the
    # stance-phase effect itself, which an open-loop model structurally
    # cannot chase without a contact/stance signal it doesn't have. Accepted
    # as a known limitation rather than over-fit to one recording -- flag for
    # a stance-aware follow-up only if hardware behavior shows it matters.
    servo_tau_ankle: 0.28
    # Slew cap matching hardware_bridge's max_joint_rate_rad_s (see that
    # file's comment for the derivation). EWMA alone still converges faster
    # than the real chain during large steps, because the real chain also
    # caps the RATE of change independent of the filter's own catch-up
    # curve. Adding this closed nearly all of the remaining timing gap
    # between this feedback model and the real delivery -- see
    # docs/servo_tau_mismatch.png and docs/servo_tau_plus_slew_hypothesis.png
    # for the measured before/after (leg_odometry's feedback led the real
    # delivery by ~45ms with tau matched alone, ~5ms with this added).
    #
    # Shared across all 12 joints, including ankle: the servo_tau_ankle sweep
    # above also varied this rate and found it had no meaningful effect on the
    # ankle floor-dwell gap, so a separate ankle rate would just be a knob
    # that does nothing.
    servo_max_rate_rad_s: 3.0
    # Matches hardware_bridge.yaml's command_rate_hz. The real chain
    # throttles the policy's raw ~200Hz stream down to this rate BEFORE its
    # EWMA+slew ever run (the PCA9685 only refreshes this fast); this node's
    # own EWMA+slew must run on that same throttled cadence, not the raw
    # policy rate. Missing this let a brief (<20ms) commanded transient that
    # the real chain would only partially see (or drop) get processed here at
    # full resolution, producing an overshoot the real servo likely never
    # fully reaches -- see on_cmd()'s throttle gate.
    command_rate_hz: 50.0
    # High-pass leak on the specific force (s): rejects a slow DC bias (e.g. from
    # a tilted IMU calibration) so it cannot integrate into runaway /odom drift.
    # 0 disables. Gait acceleration oscillates about zero (~1.5 s period) so its
    # per-cycle integral nets out even under a short tau; 3 s converges fast
    # enough that a bad calibration stops pumping velocity within seconds.
    bias_leak_tau: 3.0
    # Stationary-gated leak on gyro-z, separate from bias_leak_tau above.
    # That leak runs continuously because gait acceleration genuinely
    # oscillates about zero; yaw rate during a genuine sustained turn does
    # NOT, so the same trick would reject real turning as bias. Instead this
    # only refines the gyro-z bias estimate while the robot is confirmed
    # stationary (joints still + no accel, same gate ZUPT uses) — true
    # gyro-z reads exactly 0 then — and holds the estimate during any motion,
    # turns included. There is no magnetometer on this board, so nothing else
    # corrects yaw; without this, an upstream residual gyro bias integrates
    # straight into /odom's heading with nothing to reject it.
    #
    # tau chosen via an Isaac-Sim sweep (pure yaw rotation, wz=0.15 rad/s,
    # ~21s, closed through policy_controller's heading-hold) comparing
    # leg_odometry's guessed heading change against Isaac ground truth:
    #   tau (s)   0.5    1.0    2.0    5.0    10.0   @ bias=0.02 rad/s
    #   error %   3.21   4.30   1.99   2.23   2.54
    # 2.0 had the lowest error; confirmed stable across a bias range at that
    # tau (0/0.02/0.04 rad/s -> 3.41%/1.99%/2.87%, vs ~7-8% with the leak
    # disabled) — no regression when there's no real bias to correct. The
    # injected bias values are illustrative (no hardware measurement exists
    # yet for the residual left after hardware_bridge's own boot
    # calibration); this sim used a hand-rolled Madgwick-equivalent stand-in
    # (no magnetometer, no drift correction), not the real imu_filter_madgwick
    # package, so real-hardware confirmation is still a follow-up.
    yaw_bias_leak_enabled: true
    yaw_bias_leak_tau: 2.0
    # Hard stationary gate on command staleness (s). When /cmd_vel is silent
    # longer than this the robot is uncommanded (the policy idles after 0.5 s),
    # so any dead-reckoned velocity is phantom and is forced to zero with the
    # position anchored — regardless of what the biased IMU reads. Must stay
    # above the policy's cmd_vel_timeout so packet gaps don't read as idle.
    cmd_vel_stale_s: 1.0
    # ── IMU scaling ────────────────────────────────────────────────────────
    # Multiplier on world-frame accel before dead-reckon integration.
    # <1.0 reduces IMU contribution (dial down when IMU over-reports).
    # >1.0 if IMU under-reports. Set to 0.0 to zero out accel entirely.
    imu_accel_scale: 1.0
    # Multiplier on angular velocity in odom twist (gyro passthrough to
    # consumers of odom.twist.angular.z).
    imu_gyro_scale: 1.0
    # ── Lidar-aided correction (complementary filter) ─────────────────────
    # Monitors map→odom TF changes from slam_toolbox / AMCL and pulls the
    # dead-reckoned pose toward the scan-matched estimate. Gain = 0: pure
    # IMU dead-reckon. Gain = 1: full lidar trust (not recommended — noisy
    # per-scan, better as correction than primary).
    #
    # Works in both SLAM (mapping) and known-map (AMCL) modes — both
    # publish map→odom TF. Inactive when nav is not running (TF absent).
    #
    # Non-circular: map→odom changes originate from lidar scan-matching
    # against the environment; converting back into odom frame isolates
    # the drift error without feeding back through our own TF.
    lidar_correction_enabled: true
    # Fraction of position error removed per update (0..1). 0.15 is
    # conservative: ~6 updates to absorb 50% error, avoids oscillation
    # from scan noise and slam's own lag. Raise toward 0.3 for faster
    # convergence; 0 = no lidar feedback.
    lidar_gain_xy: 0.15
    # Fraction of yaw error removed per update (0..1). Slightly higher
    # than xy because yaw drift is unbounded (no magnetometer reference)
    # and lidar heading is the only absolute source.
    lidar_gain_yaw: 0.20
    # Max position correction per TF update (m). Rejects slam_toolbox
    # loop-closure jumps (> 0.5 m in one update) — those belong in
    # map→odom, not our odom frame. Also bounds per-cycle noise from
    # individual scan matches.
    max_correction_step_m: 0.05
    # Max yaw correction per TF update (rad) ≈ 2.9°.
    max_correction_step_yaw_rad: 0.05
    # If no TF update for this long, correction goes inactive (pure
    # dead-reckon). Matches stall behavior if nav dies.
    correction_timeout_s: 1.0
