name: ROS 2 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  colcon:
    name: colcon build & test (Jazzy · ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm   # native arm64 — matches UNO Q deploy target
    steps:
      - uses: actions/checkout@v4

      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install ONNX Runtime (C++)
        run: |
          ORT_VER=1.20.1
          case "${{ matrix.arch }}" in
            amd64) ORT_ARCH=x64 ;;
            arm64) ORT_ARCH=aarch64 ;;
          esac
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VER}/onnxruntime-linux-${ORT_ARCH}-${ORT_VER}.tgz"
          sudo mkdir -p /opt/onnxruntime
          sudo tar -xzf /tmp/ort.tgz -C /opt/onnxruntime --strip-components=1

      - name: Make ament_package importable by the build Python
        # ros-jazzy-ament-package installs ament_package into the ROS prefix
        # (/opt/ros/jazzy/.../site-packages), so /usr/bin/python3 can import it
        # only while PYTHONPATH carries that path. colcon's parallel per-package
        # cmake configure occasionally spawns the templates_2_cmake.py subprocess
        # with a PYTHONPATH that has dropped the ROS site-packages, giving an
        # intermittent "ModuleNotFoundError: No module named 'ament_package'"
        # (hits a different package each run; CMAKE_PREFIX_PATH still resolves so
        # the build otherwise looks fine). Mirror the module into the system
        # dist-packages, which is always on the default sys.path, so the import
        # is resolvable regardless of PYTHONPATH ordering.
        run: |
          set -eux
          src="$(find /opt/ros/jazzy -type d -name ament_package -path '*/site-packages/*' 2>/dev/null | head -n1)"
          dst=/usr/lib/python3/dist-packages
          test -n "$src"
          sudo mkdir -p "$dst"
          sudo cp -r "$src" "$dst/"
          # verify with PYTHONPATH cleared so the import can only resolve from the
          # default system site (dist-packages) -- i.e. the race is actually fixed.
          env -u PYTHONPATH /usr/bin/python3 -c "import ament_package; print('ament_package OK:', ament_package.__file__)"

      - name: Build & test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: >
            spider_msgs
            big_bertha_description
            big_bertha_policy_controller
            big_bertha_sim_bringup
          # -DONNXRUNTIME_ROOT is a build-time flag. extra-cmake-args feeds it to
          # `colcon build --cmake-args` ONLY -- not `colcon test` (which rejects
          # --cmake-args). The old colcon-extra-args went to both verbs and broke
          # test; colcon-defaults overwrote action-ros-ci's defaults and broke the
          # build. extra-cmake-args is the action's purpose-built input for this.
          extra-cmake-args: -DONNXRUNTIME_ROOT=/opt/onnxruntime
