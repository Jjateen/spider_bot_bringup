name: Config checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: YAML / URDF / files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: YAML files parse correctly
        run: |
          python3 << 'EOF'
import os, yaml, glob, sys
errors = 0
ignore = {'build', 'install', 'log', '.git', 'node_modules'}
for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
    parts = os.path.normpath(f).split(os.sep)
    if any(p in ignore for p in parts):
        continue
    try:
        yaml.safe_load(open(f))
    except yaml.YAMLError as e:
        print(f'FAIL: {f} — {e}')
        errors += 1
sys.exit(errors)
EOF

  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yml

  file-checks:
    name: Required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check LICENSE exists
        run: test -f LICENSE
      - name: Check README exists
        run: test -f README.md
      - name: Every package has package.xml
        run: |
          for d in spider_msgs big_bertha_description big_bertha_policy_controller \
                   big_bertha_sim_bringup big_bertha_bringup leg_odometry; do
            if [ -d "$d" ]; then
              test -f "$d/package.xml" || { echo "missing $d/package.xml"; exit 1; }
            fi
          done

      - name: URDF / XACRO files parse as XML
        run: |
          sudo apt-get install -y -qq libxml2-utils
          errors=0
          for f in $(find . -name '*.urdf.xacro' -o -name '*.urdf'); do
              if ! xmllint --noout "$f"; then
                  echo "FAIL: $f"
                  errors=$((errors + 1))
              fi
          done
          exit $errors

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
