<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="1000" height="730">
  <defs>
    <style>text{font-family:'Helvetica Neue',Arial,sans-serif;}</style>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5f6368"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#202124">Big Bertha sensor core architecture</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#5f6368">one C++ node, the stock router, streaming both ways, no python and no raw uart</text>

  <!-- QUALCOMM -->
  <rect x="40" y="80" width="920" height="255" rx="12" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <text x="58" y="106" font-size="14" font-weight="700" fill="#1967D2">Qualcomm   /   Debian Linux   /   ROS 2 native   (all C++)</text>

  <rect x="60" y="122" width="420" height="128" rx="8" fill="#ffffff" stroke="#4285F4" stroke-width="1.5"/>
  <text x="76" y="146" font-size="13" font-weight="700" fill="#202124">ROS 2 stack</text>
  <text x="76" y="169" font-size="12" fill="#3c4043">Nav2   /   AMCL   /   EKF   /   scan filter</text>
  <text x="76" y="191" font-size="12" fill="#3c4043">policy_controller   (ONNX policy on CPU)</text>
  <text x="76" y="213" font-size="11" fill="#5f6368">outputs 12 joint targets, consumes /imu</text>
  <text x="76" y="233" font-size="11" fill="#5f6368">lidar and camera feed perception here, over USB</text>

  <rect x="60" y="272" width="195" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="157" y="301" text-anchor="middle" font-size="12.5" fill="#202124">LIDAR  (USB)</text>
  <rect x="275" y="272" width="205" height="48" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <text x="377" y="301" text-anchor="middle" font-size="12.5" fill="#202124">Camera  (USB / CSI)</text>
  <line x1="157" y1="272" x2="157" y2="250" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="377" y1="272" x2="377" y2="250" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>

  <rect x="560" y="122" width="400" height="196" rx="10" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
  <text x="580" y="148" font-size="14" font-weight="700" fill="#202124">hw_bridge_node   (rclcpp, C++)</text>
  <text x="580" y="172" font-size="12" fill="#3c4043">MessagePack-RPC client connected straight to</text>
  <text x="580" y="190" font-size="12" fill="#3c4043">/run/arduino-router/rpc.sock</text>
  <text x="580" y="214" font-size="12" fill="#1e8e3e">no python    no tcp    no json relay</text>
  <text x="580" y="240" font-size="11.5" fill="#3c4043">sub joint targets    to    notify(set_servo_pwms)</text>
  <text x="580" y="260" font-size="11.5" fill="#3c4043">provide(imu)    to    publish /imu   (mcu stamped)</text>
  <text x="580" y="286" font-size="11" fill="#5f6368">one process replaces the old four hops</text>

  <line x1="480" y1="150" x2="560" y2="150" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="520" y="143" text-anchor="middle" font-size="10.5" fill="#5f6368">targets</text>
  <line x1="560" y1="182" x2="480" y2="182" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="520" y="197" text-anchor="middle" font-size="10.5" fill="#5f6368">/imu</text>

  <!-- ROUTER LINK -->
  <rect x="600" y="358" width="320" height="56" rx="10" fill="#F1F3F4" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="760" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#3c4043">arduino-router</text>
  <text x="760" y="402" text-anchor="middle" font-size="11.5" fill="#5f6368">MsgPack-RPC over internal UART  @ 460800</text>

  <line x1="700" y1="318" x2="700" y2="500" stroke="#1a73e8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="830" y1="500" x2="830" y2="318" stroke="#1a73e8" stroke-width="2" marker-end="url(#ab)"/>

  <text x="70" y="372" font-size="12" fill="#1a73e8">down:  notify(set_servo_pwms)</text>
  <text x="70" y="389" font-size="11" fill="#5f6368">12 servo targets @ 50 Hz, fire and forget</text>
  <text x="70" y="413" font-size="12" fill="#1a73e8">up:  notify(imu)</text>
  <text x="70" y="430" font-size="11" fill="#5f6368">quat + gyro + accel + mcu timestamp @ 200 Hz</text>

  <!-- STM32 -->
  <rect x="40" y="455" width="920" height="238" rx="12" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="58" y="481" font-size="14" font-weight="700" fill="#1e8e3e">STM32 MCU   /   Zephyr sketch (C++)   /   stays in App Lab</text>

  <rect x="60" y="500" width="250" height="60" rx="8" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.5"/>
  <text x="185" y="525" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202124">watchdog</text>
  <text x="185" y="545" text-anchor="middle" font-size="11" fill="#3c4043">no command 150 ms  to  safe crouch</text>

  <rect x="560" y="500" width="230" height="60" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="1.5"/>
  <text x="675" y="523" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202124">servo command handler</text>
  <text x="675" y="543" text-anchor="middle" font-size="11" fill="#3c4043">rad to pwm, per-joint calibration</text>

  <rect x="810" y="500" width="150" height="60" rx="8" fill="#ffffff" stroke="#34A853" stroke-width="1.5"/>
  <text x="885" y="523" text-anchor="middle" font-size="12.5" font-weight="700" fill="#202124">IMU sampler</text>
  <text x="885" y="543" text-anchor="middle" font-size="10.5" fill="#3c4043">200 Hz, mcu stamp</text>

  <line x1="310" y1="530" x2="560" y2="530" stroke="#9AA0A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)"/>
  <text x="435" y="522" text-anchor="middle" font-size="10" fill="#5f6368">drives safe pose</text>

  <rect x="560" y="600" width="120" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="620" y="629" text-anchor="middle" font-size="12" fill="#202124">PCA9685</text>
  <rect x="700" y="600" width="130" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="765" y="629" text-anchor="middle" font-size="12" fill="#202124">12x MG995</text>
  <rect x="850" y="600" width="110" height="48" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <text x="905" y="629" text-anchor="middle" font-size="11.5" fill="#202124">MPU6050</text>

  <line x1="620" y1="560" x2="620" y2="600" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="632" y="583" font-size="10" fill="#5f6368">I2C</text>
  <line x1="680" y1="624" x2="700" y2="624" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="690" y="616" text-anchor="middle" font-size="9.5" fill="#5f6368">PWM</text>
  <line x1="905" y1="600" x2="905" y2="560" stroke="#5f6368" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="917" y="583" font-size="10" fill="#5f6368">I2C</text>

  <text x="500" y="715" text-anchor="middle" font-size="11" fill="#9aa0a6">fallback only if the benchmark fails: bare Zephyr firmware with our own packed-binary protocol at 1 to 2 Mbaud (gives up App Lab)</text>
</svg>
