# slam_toolbox (online async) configuration for Big Bertha (mapping module).
#
# Consumes /scan + the odom->base_link tf (from the EKF) and publishes /map
# plus the map->odom transform. Tuned for the 8 m YDLidar X2 class scan in the
# ~10 x 10 m obstacle_world arena.
slam_toolbox:
  ros__parameters:
    # Plugins
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames / topics
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    # Filtered, not raw: the body-fixed lidar tilts with the gait and its floor
    # strikes would otherwise be BAKED INTO the saved map, which AMCL then
    # localizes against (AMCL and both costmaps already use /scan_filtered).
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping
    # Anchor the map frame at the world spawn (demo point A) so a SLAM-built
    # map is world-aligned: the same goal coordinates work in SLAM mode and
    # when the saved map is reused in known-map mode (demo_slam_patrol.sh).
    map_start_pose: [-3.5, -3.5, 0.0]

    # General
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    # 5.0, not 8.0: Nav2 only ever consumes 3.0 (raytrace_max_range), so
    # mapping to 8 extended the map with returns no planner reads, and each
    # extension re-initialised the global costmap static layer -- the repeating
    # "Trying to create a map of size X x Y". 5.0 keeps 1.67x margin over Nav2
    # and drops the far soft-target returns that are least reliable indoors.
    # Raise toward 6-7 if a room wider than 5 m stops closing its walls.
    max_laser_range: 5.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # Motion thresholds (legged platform: allow small moves to register)
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    # Karto marks a cell occupied while hits/passes > this, so clearing a
    # REMOVED obstacle needs passes > hits/threshold. Upstream's 0.1 (what we
    # were inheriting by not setting it) means a box observed for 100 scans
    # needs 1000 clearing scans before it leaves the map, which is why the old
    # position of the test box stayed visible long after the scan stopped
    # seeing anything there. 0.4 needs 2.5x the hits instead of 10x.
    #
    # Safe for real structure: a wall is hit by nearly every ray that reaches
    # it, so its ratio sits near 1.0, far above 0.4. A thin object seen edge-on
    # can sit lower and may now drop out of /map sooner, but Nav2's obstacle
    # layer still marks it live from /scan_filtered, so it is not lost to the
    # planner.
    #
    # Note this only governs /map. The global costmap's static_layer takes /map
    # and combines with updateWithMax, so while a cell is lethal in the map the
    # obstacle layer CANNOT raytrace it away. Until slam clears it, the costmap
    # cannot. scripts/reset_map.sh is the immediate escape hatch.
    occupancy_threshold: 0.4
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
