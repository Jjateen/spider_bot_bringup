# robot_localization EKF for Big Bertha -- Isaac Sim variant.
#
# Identical to ekf.yaml except for one change: odom0_config's yaw index (5)
# is true here, fusing /odom's absolute orientation. Every other parameter
# (process noise, covariances, IMU config, two_d_mode, etc.) is unchanged --
# keep this file in sync with ekf.yaml if those get retuned.
#
# Why this diverges from ekf.yaml: that file's own comment says yaw is
# deliberately NOT fused from odometry because "leg_odometry yaw drifts
# significantly even with gz ground truth" (Gazebo) and "hardware has no
# magnetometer" (real robot) -- both true, and both irrelevant here. On the
# Isaac path, /odom's orientation is PhysX's own ground-truth chassis pose
# each tick, not integrated leg kinematics -- confirmed directly: with the
# robot genuinely motionless (verified: raw /odom orientation exactly
# constant over a 25s idle window), /odometry/filtered still drifted +0.0042
# rad in that same window, purely from the EKF's open-loop gyro-rate
# integration (imu0_config index 11) having no absolute reference to correct
# against. Fusing /odom's actual ground-truth yaw here bounds that drift
# instead of letting it accumulate unbounded, without reintroducing the
# problem this was originally avoided for (this isn't leg-odometry, and
# Isaac's synthetic IMU's own stale-angular-velocity bug is fixed separately
# in launch_isaac.py -- this is a second, complementary layer of protection
# against whatever process/measurement noise the EKF's own prediction step
# would otherwise let wander unconstrained).
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # --- Sensor 0: odometry (X, Y position AND yaw -- see file header) ---
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # --- Sensor 1: IMU (linear acceleration and angular velocity only) ---
    # Unchanged from ekf.yaml: gyro_z (index 11) still feeds the EKF's
    # process model between odometry updates; now bounded by odom0's
    # absolute yaw instead of drifting open-loop.
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    # Q scales with commanded velocity: trust the model less while the gait
    # accelerates, more at rest (legged platforms oscillate at gait frequency).
    dynamic_process_noise_covariance: true

    # Process noise covariance (15x15, diagonal dominant).
    process_noise_covariance: [
