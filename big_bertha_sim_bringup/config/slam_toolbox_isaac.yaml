# slam_toolbox (online async) configuration for Big Bertha on Isaac Sim.
#
# Copy of slam_toolbox.yaml with one change: occupancy_threshold raised from
# 0.4 to 0.7. Everything else (including the rationale comments) is
# unchanged from the Gazebo config -- see that file for the full picture.
#
# Why Isaac needs its own value: measured (monitor_costmap_ghosts.py, a 90s
# straight walk) that even with scan_ground_filter's floor_margin raised to
# 0.07 for Isaac (isaac_bringup.launch.py), the residual ~5% ghost rate is
# NOT random -- it's a persistent, direction-biased lean from this gait's
# asymmetric leg-phase offsets (see that launch file's own comment). Walking
# in a fairly straight line for any sustained stretch means that consistent
# bias keeps hitting cells offset from the real path in the same direction,
# and at 0.4 that was enough to bake a ~7 m long phantom wall into /map
# within 90 seconds -- growing from ~1500 to ~1800-2700 unexplained lethal
# cells over that walk, confirmed against the known obstacle layout, not
# just measured as a raw survival percentage.
#
# 0.4 was tuned for Gazebo, where a wall's hit/pass ratio sits near 1.0 (per
# slam_toolbox.yaml's own comment) -- comfortably above even a low
# threshold. Isaac's directionally-biased residual leaves less margin
# between "real structure" and "consistent ghost", so a higher bar is
# needed before a cell earns lethal status, and per the same math (needs
# passes > hits/threshold to clear), 0.7 also makes an already-wrong cell
# easier to walk back than 0.4 did.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping
    map_start_pose: [-3.5, -3.5, 0.0]

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.12
    max_laser_range: 5.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    occupancy_threshold: 0.7
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
