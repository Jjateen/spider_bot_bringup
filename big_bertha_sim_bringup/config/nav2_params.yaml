bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # The in-package behavior trees under config/behavior_trees/ are wired in
    # by nav2.launch.py via RewrittenYaml (absolute installed-share paths).
    # These placeholders document the keys and give a sane default if the
    # params file is loaded without that rewrite.
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # Long failure tolerance: the crawl is slow and the regulated controller can
    # briefly produce no valid command on a tight curve; at 0.3 s that tripped
    # "controller patience exceeded" -> the BT fired Spin/DriveOnHeading
    # recoveries that wreck the gait. 10 s lets the crawl work through it.
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # Big Bertha crawls at ~0.1 m/s and yaws slowly, so it needs a long
      # allowance to clear the progress bar (was 45 s -> aborted). The crawl can
      # spend many seconds turning in place, so keep this generous.
      movement_time_allowance: 150.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # With ground-truth localization (demo default) Nav2 sees the true pose and
      # the cross-track steering climbs the residual DART crab off the wall, so
      # the robot physically reaches B. 0.6 m latches success as the robot passes
      # within ~0.56 m (an honest arrival for a ~0.36 m crawler) and stops it
      # before the under-damped approach can overshoot past B. (1.2 here masked
      # the old AMCL false-success where the robot sat metres short.)
      xy_goal_tolerance: 0.6
      # Reaching point B is what matters; the crawl yaws slowly and need not end
      # at a specific heading, so don't gate goal success on final orientation
      # (was 0.25 rad -> the robot could sit on B forever failing the yaw check).
      yaw_goal_tolerance: 3.15
    # RegulatedPurePursuitController: robust for a small diff-drive base and
    # the gz VelocityControl drive. Tuned for Big Bertha's modest speeds in
    # the obstacle arena.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Match the learned crawl envelope: the gait tracks ~0.08-0.12 m/s forward
      # (MG995-actuator-limited -- a higher command just saturates the gait and
      # overruns the path). The short lookahead keeps the carrot near the robot
      # for tight following.
      desired_linear_vel: 0.12
      # Tighter lookahead (was 2.5/1.5/3.0): the carrot stays near the robot ON
      # the path so it tracks the path's turns around obstacles instead of aiming
      # far past them and grazing walls. The old large value was a workaround for
      # a gait that could not yaw; the symmetric/flatter policy now yaws +/-0.8
      # and use_rotate_to_heading makes the sharp turns, so we can follow tightly
      # -- the responsiveness fix (robot acts on a new path quickly).
      # 1.2 -> 0.7: even tighter so the robot does NOT cut the corner of the
      # path's bend around an on-path obstacle (box_1/pillar_1/box_2 all sit on
      # the diagonal, a slalom with ~0.8-1.1 m gaps). A short carrot keeps it
      # weaving through the gap centres; the responsive gait (yaw track ~1.0) can
      # follow it without the spiral the old large value guarded against.
      lookahead_dist: 0.7
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8  # match the gait's trained yaw cap (+/-0.8 rad/s)
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      # Kept at 1.0 s (a 0.4 s trial let the robot clip obstacles). The real cause
      # of the old "freeze near obstacles" was ghost walls from the tilted body
      # lidar, now removed by scan_ground_filter -- so 1.0 s no longer over-freezes
      # yet still halts safely before a genuine collision.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Floor the regulated speed at the crawl's real pace, not 0.25 (which the
      # gait cannot reach, so the controller thought it was stalled).
      regulated_linear_scaling_min_speed: 0.06
      # Enable hard in-place turns: when the path heading error exceeds
      # rotate_to_heading_min_angle, RPP stops and rotates on the spot instead of
      # arcing forward. This is the "hard left/right" the robot needs to peel away
      # from an obstacle it is about to hit -- without it the slow forward-only
      # arc could not change heading fast enough and the robot stuck on contact.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.38
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18
      resolution: 0.05
      rolling_window: true
      width: 24
      height: 24
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.38
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


