# Nav2 parameters for the servers nav2.launch.py actually starts:
# controller/smoother/planner/behavior/bt_navigator (+ costmaps).
# AMCL lives in amcl.yaml; velocity_smoother/collision_monitor are
# deliberately not run (controller_server publishes /cmd_vel directly).
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Real BT paths are rewritten by nav2.launch.py; these are fallbacks.
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 10 s: at 0.3 s a tight curve tripped "patience exceeded" -> Spin/BackUp
    # recoveries that wreck the gait.
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # Generous on purpose: the crawl legitimately spends many seconds
      # pivoting with near-zero translation, and this checker only sees
      # translation. 35 s tripped mid-pivot and escalated into recoveries the
      # platform cannot execute (no reverse -> BackUp always fails).
      movement_time_allowance: 150.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.6 was too generous and is what "the robot stops before it reaches
      # the goal" actually was: the body is ~0.36 m across, so the checker
      # declared SUCCESS up to 1.7 body lengths short and the controller
      # stopped there. Nothing cancelled the path, Nav2 believed it had
      # arrived. 0.30 is under one body length, which reads as arrival, and
      # still leaves ~1.7x robot_radius of slack for the under-damped
      # approach. stateful latches success on first entry, so the robot does
      # not have to hold the tolerance. Tighten further only if the approach
      # stops circling; too tight and an under-damped crawler orbits the goal
      # without ever latching.
      xy_goal_tolerance: 0.30
      # Don't gate success on final heading (0.25 left the robot failing the
      # yaw check forever on the goal point).
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # v1.1.0 on the torque-speed plant tracks 0.20 m/s at a 0.29 command
      # (0.135 at 0.12), so the old "higher just saturates it" note is stale --
      # that was v1.0.0 on the optimistic actuator.
      desired_linear_vel: 0.29
      # Short carrot (was 2.5): keeps the robot ON the path's bends through the
      # ~0.8-1.1 m obstacle gaps instead of cutting corners into walls.
      # Do NOT shorten further: 0.45 was tested and FAILED -- the crawl weaves
      # instead of converging and never finishes the obstacle leg (patrol 0/3).
      # A slow, weak-yaw platform needs a LONGER carrot for stability, not a
      # shorter one.
      lookahead_dist: 0.7
      # Back to the trained ceiling 0.5. The old 0.27 was the MEASURED in-place
      # yaw rate, set so RPP's pivot timing matched reality, and that reasoning
      # was wrong twice over.
      #
      # First, this is a COMMAND, not an observation. The plant delivers about
      # 0.27 when asked for 0.5, so asking for 0.27 delivers roughly 0.15.
      # Second, it also throttles the gait: the clock boost uses
      # turn_clock_boost * min(|wz|/0.4, 1), which only saturates at 0.4, so
      # 0.27 ran the cadence at 1.54 instead of 1.80. The two compound to about
      # 46% of the platform's turn authority, which is the "yaw is too little"
      # report from the hardware run.
      #
      # Anything below 0.4 pays that second penalty, so there is no useful
      # setting between 0.4 and 0.5. The pivot-timing concern it was traded for
      # is cosmetic: RPP rotates until the heading error closes, it does not
      # time the pivot open-loop, so over-commanding just turns faster.
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      # These two have to move with xy_goal_tolerance or the fix to it just
      # trades stopping short for stalling short.
      #
      # scaling_dist was 0.6, exactly the old tolerance, so the goal checker
      # fired at the same distance the deceleration ramp began and the slow
      # approach never actually ran. With the tolerance now 0.30 the robot
      # would have had to cover 0.6 -> 0.30 m on the ramp. 0.35 starts the
      # ramp just outside the tolerance instead.
      #
      # The floor was 0.05 m/s, which this plant cannot walk at: v1.1.0 needs
      # about a 0.12 command to move at all (it tracks 0.135 m/s there), and
      # the policy gates its gait below stand_vx_thresh 0.02 anyway. A 0.05
      # command is a crawl the servos will not deliver, so the last stretch
      # before the goal would creep or stop outright.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.35
      use_collision_detection: true
      # 1.0 s (0.4 clipped obstacles); ghost walls were the real over-freeze
      # cause, now removed by scan_ground_filter.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Floor at the crawl's real pace (0.25 read as stalled).
      regulated_linear_scaling_min_speed: 0.06
      # In-place pivots for sharp obstacle peel-aways only.
      use_rotate_to_heading: true
      # 1.0 rad (was 0.5): the spawn ~45 deg heading error used to trigger a
      # pivot that wound into a full circle (gait tracks ~0.28 rad/s vs the 0.8
      # command). Moderate headings now arc out while walking.
      rotate_to_heading_min_angle: 1.0
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0  # matches the 6 Hz lidar; see ydlidar_x2.yaml
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Polygon, not robot_radius: no circle fits the robot's asymmetric
      # stance regardless of where base_link sits. (Historical note: this
      # was originally written when base_link sat ~9.2 cm off the chassis
      # center; base_link was recentered 2026-08-28 and this polygon
      # translated to match, see the footprint line's own comment -- the
      # radii/sweep/area figures below are relative to base_link and are
      # unaffected by that shift.) At the default stance the four
      # feet are at radii 0.112, 0.219, 0.229 and 0.293 m, and over a gait
      # cycle they sweep to 0.373 m. robot_radius 0.18 was therefore under
      # half the robot on one side while wasting 6.8 cm of margin on the
      # other, and Nav2 planned through gaps the legs then clipped.
      #
      # This is the convex hull of every foot tip over full cycles of
      # forward, slow, left turn, right turn, pivot and stand, grown 2 cm,
      # then reduced to 8 vertices. The polygon itself is ~0.244 m^2 and
      # about 0.55 m across, and base_link is inside it as required. Shape
      # and area are frame-independent, but inscribed/circumscribed radius
      # are NOT -- both are measured *from base_link*, so see the
      # 2026-08-28 note below for the current values.
      #
      # REGENERATE THIS whenever default_joint_pos, action_scale,
      # thigh_action_scale, shin_action_scale or steer_max change: the sweep
      # is a function of all of them. Generated at coxa 0.25, thigh 0.45,
      # shin 0.32, steer_max 0.32.
      #
      # 2026-08-28: base_link was recentered to the chassis's true geometric
      # center in big_bertha.urdf.xacro (it was previously offset ~6.5cm
      # toward one corner). This polygon is rigidly translated by that same
      # offset (-0.06489606, +0.06499993 per vertex) to match -- the sweep's
      # shape and area are unchanged by a translation, only re-anchored to
      # the corrected base_link origin. Only rerun the sweep generator (not
      # this translation) if coxa/thigh/shin/steer_max actually change.
      # Inscribed/circumscribed radius, however, ARE measured relative to
      # base_link and so did change for real, moving the reference point to
      # sit correctly inside the polygon rather than off to one side: Nav2
      # now computes inscribed 0.255 (was 0.169 relative to the old,
      # off-center origin), circumscribed ~0.31 (was 0.403) -- see the
      # inflation_layer comment below for why inflation_radius was raised
      # to match.
      footprint: "[[-0.272, -0.104], [-0.220, -0.221], [0.102, -0.271], [0.244, -0.193], [0.273, 0.107], [0.236, 0.203], [0.132, 0.281], [-0.202, 0.235]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Exponential falloff rate outside the inscribed radius. At 3.0 the
        # curve has only decayed to exp(-3.0 * (0.38 - 0.18)) = 0.55 by the
        # outer edge, so cost is still ~138 of 252 there and the whole halo
        # renders as one dark slab with no usable gradient for the planner to
        # descend. 9.0 puts the edge at ~34. The solid core is the inscribed
        # radius, derived from the footprint polygon rather than robot_radius;
        # do not shrink inflation_radius below it to make the blobs look
        # smaller (Nav2 itself warns if you do).
        #
        # 2026-08-28: base_link was recentered to the chassis's true geometric
        # center (see big_bertha.urdf.xacro's own note) and this footprint
        # polygon translated to match. Inscribed/circumscribed radius are
        # measured *from base_link*, so unlike the footprint's shape/area,
        # they are NOT translation-invariant -- moving the reference point to
        # sit correctly inside the polygon changed them for real: Nav2 now
        # computes inscribed 0.255 (was 0.169 relative to the old, off-center
        # origin), circumscribed ~0.31 (was 0.403). inflation_radius raised
        # from 0.22 to 0.26 accordingly (Nav2 errors below the inscribed
        # radius: "highly recommended to set inflation radius to be at least
        # as big as the inscribed radius to avoid collisions").
        #
        # 0.38 -> 0.22 (now 0.26) came from a hardware run in a cluttered
        # room: inflation_radius is the outer edge of the DECAYING halo, not
        # the lethal core (that's robot_radius/the inscribed radius above),
        # but with clutter every few tens of cm the 0.38 halos merged into one
        # high-cost field and the planner kept failing, which is what left
        # the robot standing still. RE-VALIDATE 0.26 in a similarly cluttered
        # space -- the inscribed-radius increase above forced this higher
        # than the original hardware tuning, so the halo-merging failure mode
        # that 0.22 was chosen to avoid may need to be re-checked.
        cost_scaling_factor: 9.0
        inflation_radius: 0.26
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        # LEAVE AT 0: a single-ray planar lidar puts every return in one z-bin;
        # raising this demands >=2 voxels/column and blinds the costmap.
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Hold obstacles for one gait cycle: the tilting lidar only sees a
          # mid-range obstacle on the uphill phase; at persistence 0 it
          # flickered out every stride and the planner thrashed.
          #
          # 1.5 -> 1.0. Nav2 re-marks every buffered observation each costmap
          # cycle, so this is how long a stale return keeps being painted. At
          # the crawl's 0.14 m/s, 1.5 s smears an obstacle 21 cm plus whatever
          # odom drifts in that window, against a robot_radius of 0.18 -- the
          # speckle field visible around the robot in the hardware RViz capture.
          # The floor is one full gait cycle, 1/(gait_frequency*boost): 0.72 s
          # at cmd 0.29 (boost 2.06) and 1.04 s at cmd 0.12 (boost 1.44). 1.0
          # covers the slowest case; 1.5 was 1.4 to 2.1 cycles.
          observation_persistence: 1.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0  # A35 is core-starved; 1 Hz replan is ample at 0.14 m/s
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # See the local_costmap footprint note.
      # 2026-08-28: base_link was recentered to the true chassis center in
      # big_bertha.urdf.xacro (it was previously offset ~6.5cm toward one
      # corner). This polygon is rigidly translated by that same offset
      # (-0.06489606, +0.06499993 per vertex) to match -- same sweep shape
      # and area as the comment above describes, just re-anchored to the
      # corrected base_link origin. Only rerun the sweep generator (not this
      # translation) if coxa/thigh/shin/steer_max actually change.
      footprint: "[[-0.272, -0.104], [-0.220, -0.221], [0.102, -0.271], [0.244, -0.193], [0.273, 0.107], [0.236, 0.203], [0.132, 0.281], [-0.202, 0.235]]"
      resolution: 0.05
      # Non-rolling grid sized from /map by the static layer, so the planner
      # plans around mapped obstacles instead of discovering them at lidar
      # range. Both modes now serve a world-aligned /map (slam_toolbox
      # map_start_pose), so one config covers known-map AND SLAM.
      rolling_window: false
      # Unknown = free so the planner can route through unmapped open space.
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # Saved-map unknown (-1) cells read as free, not walls.
        track_unknown_space: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Hold obstacles for one gait cycle (see local_costmap note).
          observation_persistence: 1.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Exponential falloff rate outside the inscribed radius. At 3.0 the
        # curve has only decayed to exp(-3.0 * (0.38 - 0.18)) = 0.55 by the
        # outer edge, so cost is still ~138 of 252 there and the whole halo
        # renders as one dark slab with no usable gradient for the planner to
        # descend. 9.0 puts the edge at ~34. The solid core is the inscribed
        # radius, derived from the footprint polygon rather than robot_radius;
        # do not shrink inflation_radius below it to make the blobs look
        # smaller (Nav2 itself warns if you do).
        #
        # 2026-08-28: base_link was recentered to the chassis's true geometric
        # center (see big_bertha.urdf.xacro's own note) and this footprint
        # polygon translated to match. Inscribed/circumscribed radius are
        # measured *from base_link*, so unlike the footprint's shape/area,
        # they are NOT translation-invariant -- moving the reference point to
        # sit correctly inside the polygon changed them for real: Nav2 now
        # computes inscribed 0.255 (was 0.169 relative to the old, off-center
        # origin), circumscribed ~0.31 (was 0.403). inflation_radius raised
        # from 0.22 to 0.26 accordingly (Nav2 errors below the inscribed
        # radius: "highly recommended to set inflation radius to be at least
        # as big as the inscribed radius to avoid collisions").
        #
        # 0.38 -> 0.22 (now 0.26) came from a hardware run in a cluttered
        # room: inflation_radius is the outer edge of the DECAYING halo, not
        # the lethal core (that's robot_radius/the inscribed radius above),
        # but with clutter every few tens of cm the 0.38 halos merged into one
        # high-cost field and the planner kept failing, which is what left
        # the robot standing still. RE-VALIDATE 0.26 in a similarly cluttered
        # space -- the inscribed-radius increase above forced this higher
        # than the original hardware tuning, so the halo-merging failure mode
        # that 0.22 was chosen to avoid may need to be re-checked.
        cost_scaling_factor: 9.0
        inflation_radius: 0.26
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
