# Nav2 parameters for the servers nav2.launch.py actually starts:
# controller/smoother/planner/behavior/bt_navigator (+ costmaps).
# AMCL lives in amcl.yaml; velocity_smoother/collision_monitor are
# deliberately not run (controller_server publishes /cmd_vel directly).
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Real BT paths are rewritten by nav2.launch.py; these are fallbacks.
    default_nav_to_pose_bt_xml: "navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 10 s: at 0.3 s a tight curve tripped "patience exceeded" -> Spin/BackUp
    # recoveries that wreck the gait.
    failure_tolerance: 10.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # Generous for the ~0.1 m/s crawl (45 s aborted mid-turn).
      movement_time_allowance: 150.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.6 m: honest arrival for a ~0.36 m crawler; stops the under-damped
      # approach before it overshoots. (1.2 masked an AMCL false-success.)
      xy_goal_tolerance: 0.6
      # Don't gate success on final heading (0.25 left the robot failing the
      # yaw check forever on the goal point).
      yaw_goal_tolerance: 3.15
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # The gait tracks ~0.08-0.12 m/s; a higher command just saturates it.
      desired_linear_vel: 0.12
      # Short carrot (was 2.5): keeps the robot ON the path's bends through the
      # ~0.8-1.1 m obstacle gaps instead of cutting corners into walls.
      lookahead_dist: 0.7
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.0
      lookahead_time: 1.5
      # 0.5 = the real trained yaw envelope; the policy node clamps wz there,
      # so 0.8 made RPP plan pivots 60% faster than the plant can go.
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      # 1.0 s (0.4 clipped obstacles); ghost walls were the real over-freeze
      # cause, now removed by scan_ground_filter.
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      # Floor at the crawl's real pace (0.25 read as stalled).
      regulated_linear_scaling_min_speed: 0.06
      # In-place pivots for sharp obstacle peel-aways only.
      use_rotate_to_heading: true
      # 1.0 rad (was 0.5): the spawn ~45 deg heading error used to trigger a
      # pivot that wound into a full circle (gait tracks ~0.28 rad/s vs the 0.8
      # command). Moderate headings now arc out while walking.
      rotate_to_heading_min_angle: 1.0
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.38
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        # LEAVE AT 0: a single-ray planar lidar puts every return in one z-bin;
        # raising this demands >=2 voxels/column and blinds the costmap.
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Hold obstacles > one gait stride: the tilting lidar only sees a
          # mid-range obstacle on the uphill phase; at persistence 0 it
          # flickered out every stride and the planner thrashed.
          observation_persistence: 1.5
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18
      resolution: 0.05
      # Non-rolling grid sized from /map by the static layer. The old "no
      # static layer, 24 m rolling window" setup left the planner blind past
      # the lidar's 2.5 m: initial plans went straight through the boxes. The
      # rolling-window workaround dated from pre-world-anchored SLAM maps
      # (slam_toolbox map_start_pose); both modes now serve a world-aligned
      # /map, so one static-layer config covers known-map AND SLAM.
      rolling_window: false
      # Unknown = free so the planner can route through unmapped open space.
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # Saved-map unknown (-1) cells read as free, not walls.
        track_unknown_space: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # Hold obstacles > one gait stride (see local_costmap note).
          observation_persistence: 1.5
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.38
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
