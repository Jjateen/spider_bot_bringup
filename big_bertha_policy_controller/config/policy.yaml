# Parameters for the Big Bertha policy controller (C++ ONNX gait node).
#
# The trained policy contract (big_bertha_v1.0.0, PR #67):
#   obs = 52 floats (the 48 below + 4 appended per-foot gait-clock sin dims),
#   action = 12 floats
#   joint_target = action_scale * action + default_joint_pos
# Joint ORDER MUST match the Isaac articulation order the policy trained on,
# NOT numeric Revolute_110..121. Isaac/PhysX orders joints by tree depth (all
# hips, then all knees, then all ankles), so obs[i]/action[i] index this order:
#   [110,113,116,119, 111,114,117,120, 112,115,118,121]
#    \---- hips ----/  \--- knees ---/  \--- ankles --/
# default_joint_pos is the big_bertha_v1.0.0 pin-tip pose: [0]x4 (hips)
# [-0.32]x4 (knees) [2.00]x4 (ankles). Feeding numeric order scrambles the obs
# and lands actions on wrong joints -> the policy collapses the robot. The
# /joint_states->obs map is by NAME, so gz publish order does not matter;
# only this list's order does.
#
# Gait clock (obs[48:52]): phase advances by gait_frequency * boost * dt each
# control step (dt = 1/control_rate), boost = min(1 + turn_clock_boost*clamp(
# |yaw|/0.4, max=1) + speed_clock_boost*clamp(vx/0.3, max=1), gait_boost_max).
# The outer cap is NOT optional -- training applies .clamp(max=2.1) and the
# terms sum to 2.9, so omitting it runs the clock 38% fast whenever vx and yaw
# are commanded together (every Nav2 arc). Per-foot offsets
# [0.0, 0.5, 0.25, 0.75] for legs 1/2/3/4 (arm_c_1_1..arm_c_4_1), sin-transformed:
# obs[48+k] = sin(2*pi * ((phase + gait_offsets[k]) % 1)). Must reproduce
# big_bertha_env.py's _pre_physics_step/_get_observations exactly.
/**:
  ros__parameters:
    # Absolute path is supplied by the launch file (package share /models).
    model_path: ""
    action_scale: 0.25
    control_rate: 50.0       # Hz
    start_enabled: true
    cmd_vel_timeout: 0.5     # s; stale /cmd_vel -> command zeroed (safe stop)
    joint_limit: 2.355      # rad; clamp joint targets (calf upper limit is the binding one at the new 2.00 rad default -- see big_bertha_description URDF revolute limits)
    # The node publishes 12 joint POSITION TARGETS; the effort-PD that emulates
    # Isaac's ImplicitActuatorCfg now lives in JointEffortPdController (see
    # big_bertha_description/config/ros2_control.yaml), where it runs
    # synchronously in the controller_manager loop and reads q/qd with zero
    # latency. Doing the PD in this node and shipping torque over a topic damps
    # against stale velocity -> jitter; hence use_effort=false here.
    use_effort: false        # publish position targets, controller does the PD
    pd_rate: 200.0           # Hz; target publish rate (policy decimated to 50)
    action_clip: 1.0         # raw policy action clamp (matches env)
    # Command envelope sent to the policy (trained ranges). Yaw is widened from
    # the old 0.15 so the heading-hold loop has real turn authority.
    # Keep max_yaw_rate at heading_max (0.5). Lowering it to 0.35 to give the
    # heading P-term correction headroom was tested and FAILED: turn rate fell
    # 0.279 -> 0.114 rad/s. The plant, not the command, is binding, so trading
    # feedforward for a correction that feeds the same saturated yaw channel is
    # a net loss. Do not reopen without changing the plant.
    max_lin_vel_x: 0.3
    max_lin_vel_y: 0.06
    max_yaw_rate: 0.5
    # ---- Heading-hold outer loop: rejects the systematic PhysX->DART contact
    # yaw drift in the deployment node (no retrain, no sim edit). It integrates
    # Nav2's commanded yaw rate into a heading setpoint and feeds the policy a
    # corrective yaw = wz + heading_kp*(desired_yaw - odom_yaw).
    heading_hold: true
    heading_kp: 2.0          # P gain on the (weak) policy yaw command
    heading_max: 0.5         # final yaw command clamp (trained |yaw| <= 0.5,
                             # see big_bertha_env.py::_reset_idx)
    heading_err_clamp: 0.4   # anti-windup: max setpoint lead/lag vs measured
    fwd_slow_err: 0.5        # |err| (rad) for forward throttle (off below)
    fwd_min_scale: 1.0       # 1.0 = no extra throttle; hip-steer does the trade
    # Hip-bias steering: calibration showed a uniform NEGATIVE hip bias cancels
    # the systematic right drift (b=-0.25 took yaw -0.086 -> +0.002), so all
    # four signs are -1 and steer_cmd = steer_kp*heading_err drives it.
    steer_kp: 1.8            # rad of hip bias per rad of heading error
    steer_ki: 0.8            # integral: removes steady heading offset vs drift
    steer_max: 0.26          # max |hip bias| (b=-0.24 ~ fully cancels drift)
    hip_steer_sign: [-1.0, -1.0, -1.0, -1.0]
    # Lateral-hold outer loop: closed-loop on the perpendicular offset from the
    # line through the latched start pose along the heading setpoint. Commands
    # the policy's lateral velocity vy = clamp(-lateral_kp*offset, +/-max_vy) to
    # hold the LINE (not just the heading), bounding the residual DART crab the
    # heading loop alone leaves. Re-latches while turning (|wz|>turn_thresh) so
    # it only holds on straight segments and lets Nav2's vy pass through in turns.
    #
    # v1.0.0 (POST-ARMATURE, the current build): with the calf armature fix
    # the base dynamics are healthy and this loop is a clean win. A/B at
    # vx=0.12 cmd: OFF -> 0.127 m/s, lateral crab ~0.02 m/s (dy 0.73 m/29 s);
    # ON -> 0.136 m/s (still 1:1) with the crab cut ~4x to ~0.005 m/s
    # (dy 0.065 m/12 s) and heading drift <0.2 deg. Default ON.
    #   Historical note: an EARLIER A/B (before the armature fix, while the
    #   calf still resonated at ~19 rad/s) found this loop net-harmful and it
    #   was defaulted OFF. That regime is gone; the resonance was the real
    #   problem, not this loop.
    lateral_hold: true
    lateral_kp: 0.6
    # Re-latch the line ONLY on a deliberate turn (raised 0.05->0.25): under Nav2
    # the RegulatedPurePursuit controller streams small path-following wz, which
    # at 0.05 kept resetting the lateral-hold reference every cycle so the loop
    # never accumulated the correction for the systematic DART south-crab. 0.25
    # ignores those corrections and only re-latches on a real commanded turn.
    lateral_turn_thresh: 0.25
    # Cross-track STEERING: convert the lateral line-offset into a heading-error
    # bias so the strong hip-bias steering (not the weak, vy<=0.06-capped lateral
    # command) pulls the robot back to the line. This is the real cure for the
    # systematic DART south-crab -- it steers the gait's forward walk into the
    # drift ("crab into the wind") and catches it before the robot pins on a wall.
    lateral_yaw_kp: 0.4     # rad of heading bias per metre of lateral offset.
                            # Moderate: kp 0.6 over-steered north into obstacles;
                            # this climbs the robot off the wall and reaches B
                            # (Nav2 goal success) without the unstable overshoot.
    lateral_yaw_max: 0.3    # max |cross-track heading bias| (rad, ~17 deg)
    # Gate the gait off below this forward command so the robot stands still
    # when idle (the policy walks forward even at vx=0, so without this it
    # free-drifts off the start before Nav2 sends the goal).
    stand_vx_thresh: 0.02
    # Station-keeping while gated/idle: the gated stance still slowly PIVOTS on
    # DART's asymmetric contact (~15 deg before the goal arrives), so nav starts
    # pointed at a wall. With this on, the heading is latched when the robot
    # stops and the hip-steering holds it (no walking) instead of letting it
    # creep. The forward gait stays gated either way.
    station_keep: true
    joint_names:
      - Revolute_110   # idx0  hip  leg1
      - Revolute_113   # idx1  hip  leg2
      - Revolute_116   # idx2  hip  leg3
      - Revolute_119   # idx3  hip  leg4
      - Revolute_111   # idx4  knee leg1
      - Revolute_114   # idx5  knee leg2
      - Revolute_117   # idx6  knee leg3
      - Revolute_120   # idx7  knee leg4
      - Revolute_112   # idx8  ankle leg1
      - Revolute_115   # idx9  ankle leg2
      - Revolute_118   # idx10 ankle leg3
      - Revolute_121   # idx11 ankle leg4
    default_joint_pos:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
    # Gait clock (see header comment): reproduces big_bertha_env.py's wave-gait
    # phase so obs[48:52] matches what the policy trained on.
    gait_frequency: 0.667
    turn_clock_boost: 0.8
    speed_clock_boost: 1.1
    # Cadence ceiling; mirrors big_bertha_env.py's .clamp(max=2.1). Binds only
    # when forward speed and yaw are commanded together -- i.e. every Nav2 arc.
    # Measured A/B on an arc (cmd vx=0.25, wz=0.35), 2.9 (the old un-clamped
    # value) vs 2.1:
    #   vx 0.104 -> 0.150 m/s  (+44%)
    #   wz 0.016 -> 0.076 rad/s (4.7x)
    # At 2.9 the robot was essentially not turning at all while moving forward.
    # Do not raise this: 2.1 is the trained contract, not a tuning knob.
    gait_boost_max: 2.1
    gait_offsets: [0.0, 0.5, 0.25, 0.75]   # legs 1/2/3/4 = arm_c_1_1..arm_c_4_1
