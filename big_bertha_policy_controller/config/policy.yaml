# Big Bertha policy controller (C++ ONNX gait node).
#
# Trained contract (big_bertha_v2.0.0): obs = 52 floats, action = 12,
# joint_target = action_scale * action + default_joint_pos.
# Joint ORDER is Isaac tree-depth (hips, knees, ankles), NOT numeric:
#   [110,113,116,119, 111,114,117,120, 112,115,118,121]
# Numeric order scrambles obs/actions and collapses the robot. The
# /joint_states->obs map is by NAME; only this list's order matters.
# Gait clock obs[48:52]: see observation_builder.hpp; must reproduce
# big_bertha_env.py's _pre_physics_step/_get_observations exactly.
/**:
  ros__parameters:
    # Absolute path is supplied by the launch file (package share /models).
    model_path: ""
    action_scale: 0.25
    # Per-joint-group override of action_scale (idx 0-3 hip, 4-7 knee, 8-11
    # ankle). Measured (not guessed): /policy_status action_norm sits at
    # sqrt(12) (full [-1,1] saturation on all 12 joints) a large fraction of
    # ticks while moving -- the policy carries phase, not amplitude, so
    # action_scale IS the delivered gait amplitude and nothing downstream
    # (PD gains, landing assist) can put lift back once it's capped low.
    # Analytic FK at the default stance (base_link->foot tip, walking the
    # urdf joint chain, no live TF/sim needed) gives each joint's foot-lift
    # leverage and remaining range at action_scale=0.25:
    #   hip    ~0 mm/rad    (axis is vertical, cannot lift at all)
    #   knee   ~-50 mm/rad, ~72 deg of range left  <- most leverage, most room
    #   ankle  ~+26 mm/rad, ~20 deg of range left  <- already near its limit
    # So the knee is the joint to push; the ankle has almost nothing left to
    # give and the hip's action_scale is irrelevant to lift (it only carries
    # steer_cmd/hip bias). Defaults below == action_scale (exact parity);
    # not yet bumped -- see plan doc before raising knee_action_scale.
    hip_action_scale: 0.25
    knee_action_scale: 0.25
    ankle_action_scale: 0.25
    control_rate: 50.0       # Hz
    start_enabled: true
    cmd_vel_timeout: 0.5     # s; stale /cmd_vel -> command zeroed (safe stop)
    joint_limit: 2.355      # rad; calf upper limit is the binding one
    # PD lives in JointEffortPdController (ros2_control.yaml): synchronous,
    # zero-latency q/qd. PD here over a topic damps stale velocity -> jitter.
    use_effort: false        # publish position targets, controller does the PD
    pd_rate: 200.0           # Hz; target publish rate (policy decimated to 50)
    action_clip: 1.0         # raw policy action clamp (matches env)
    # Trained command envelope. max_yaw_rate must stay at heading_max (0.5):
    # 0.35 was tested and FAILED (turn fell 0.279 -> 0.114 rad/s) -- the plant,
    # not the command, is binding.
    max_lin_vel_x: 0.3
    # v2.0.0 trains reverse as its own command cell, vx in [-0.15, -0.05],
    # sized to Nav2's BackUp recovery speed. vx used to be clamped at 0, which
    # discarded every BackUp command, so the robot could not reverse out of a
    # wall and SLAM exploration stalled against it. Magnitude; -0.15 applied.
    max_reverse_vel_x: 0.15
    max_lin_vel_y: 0.06
    max_yaw_rate: 0.5
    # Heading-hold: yaw = wz + heading_kp*(desired_yaw - odom_yaw); rejects the
    # systematic DART contact yaw drift without retraining.
    heading_hold: true
    heading_kp: 2.0          # P gain on the (weak) policy yaw command
    heading_max: 0.5         # final yaw clamp = trained |yaw| <= 0.5
    heading_err_clamp: 0.4   # anti-windup: max setpoint lead/lag vs measured
    fwd_slow_err: 0.5        # |err| (rad) for forward throttle (off below)
    fwd_min_scale: 1.0       # 1.0 = no extra throttle; hip-steer does the trade
    # Hip-bias steering: uniform negative bias cancels the right drift
    # (calibrated: b=-0.25 took yaw -0.086 -> +0.002), hence all signs -1.
    steer_kp: 1.8            # rad of hip bias per rad of heading error
    steer_ki: 0.8            # removes the steady heading offset vs drift
    # 0.26 -> 0.4: idle drift is a real, persistent, DETERMINISTIC creep (same
    # sign/direction across every independent fresh-spawn trial, not solver
    # noise) -- root-caused to arm_c_2_1/arm_c_3_1 having mismatched inertial
    # + servo-mount geometry vs both each other and the training URDF (which
    # has them byte-identical). URDF is off-limits to fix directly, so this
    # gives the PI hip-bias loop more authority to compensate. Measured
    # (5 fresh-respawn trials each, 15s idle): 0.26 -> avg 0.237 m drift,
    # 0.4 -> avg 0.197 m (-17%). 0.5 + steer_ki 1.4 tested and was NOT
    # better (avg 0.210) -- more I gain doesn't help, more max authority does,
    # a little. Walking-gate re-checked at 0.4, unaffected (avg 0.095 m vs
    # 0.090 m baseline, within noise). Does not eliminate the drift -- the
    # real fix is the URDF geometry, out of scope here.
    steer_max: 0.4           # max |hip bias|
    hip_steer_sign: [-1.0, -1.0, -1.0, -1.0]
    # Lateral-hold: vy = clamp(-lateral_kp*line_offset); holds the LINE, not
    # just the heading. A/B post armature fix: forward 1:1 (0.136 m/s), crab
    # cut ~4x to ~0.005 m/s. Default ON.
    lateral_hold: true
    lateral_kp: 0.6
    # Re-latch only on a deliberate turn (0.05 -> 0.25: RPP's small
    # path-following wz kept resetting the reference every cycle).
    lateral_turn_thresh: 0.25
    # Cross-track steering: line offset -> heading bias, so the strong hip-bias
    # steering pulls back to the line. kp 0.6 over-steered into obstacles.
    lateral_yaw_kp: 0.4     # rad of heading bias per metre of offset
    lateral_yaw_max: 0.3    # max |cross-track bias| (rad)
    # Gate the gait below this vx (the policy walks even at vx=0).
    stand_vx_thresh: 0.02
    # Gate the gait below this post-shaping yaw_cmd. Default (0.05) trips on
    # any heading error past ~1.4 deg (yaw_cmd = heading_kp * err), so small
    # idle wobble was triggering full gait-stepping turns instead of the
    # calm hip-bias hold below -- and an underdamped gait correcting itself
    # via full turn-steps overshoots, producing the observed idle wander.
    # Raised to give the passive hold more room before handing off to
    # active stepping.
    stand_yaw_thresh: 0.3
    # TEST: position_hold's corrective walk (triggered once drift exceeds
    # pos_hold_deadband=0.30m) can't converge through the same broken gait
    # that fails the walking gate -- suspected source of ongoing idle
    # positional drift even with stand_yaw_thresh fixed. Disabled to test.
    position_hold: false
    # Hold the latched heading while gated/idle (contact creep pivots the
    # stance ~15 deg otherwise).
    station_keep: true
    joint_names:
      - Revolute_110   # idx0  hip  leg1
      - Revolute_113   # idx1  hip  leg2
      - Revolute_116   # idx2  hip  leg3
      - Revolute_119   # idx3  hip  leg4
      - Revolute_111   # idx4  knee leg1
      - Revolute_114   # idx5  knee leg2
      - Revolute_117   # idx6  knee leg3
      - Revolute_120   # idx7  knee leg4
      - Revolute_112   # idx8  ankle leg1
      - Revolute_115   # idx9  ankle leg2
      - Revolute_118   # idx10 ankle leg3
      - Revolute_121   # idx11 ankle leg4
    default_joint_pos:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
    # Gait clock: must match big_bertha_env.py's wave-gait phase exactly.
    gait_frequency: 0.667
    turn_clock_boost: 0.8
    speed_clock_boost: 1.1
    # Trained cadence ceiling, NOT a tuning knob. Arc A/B, 2.9 vs 2.1:
    # vx 0.104 -> 0.150 m/s (+44%), wz 0.016 -> 0.076 rad/s (4.7x).
    gait_boost_max: 2.1
    gait_offsets: [0.0, 0.5, 0.25, 0.75]   # legs 1/2/3/4 = arm_c_1_1..arm_c_4_1
    # Landing assist (v3, real contact): per-leg ankle-target correction for
    # a foot that isn't touching the ground. "Settled" is ground-truth
    # contact from the per-foot contact sensors in big_bertha.gazebo.xacro
    # (bridged as /foot_contact/leg1..4, ros_gz_interfaces/msg/Contacts) --
    # not a proxy. Two earlier designs were tried and dropped: v1 (phase-
    # gated off gait_phase/gait_offsets) found no clean swing-vs-settle
    # phase plateau to calibrate from in 3 trials; v2 (velocity-proxy
    # "settled") tested clean end-to-end but net displacement was
    # statistically unchanged from baseline, and its velocity-only test had
    # a blind spot -- a frozen-but-ungrounded leg has low velocity, so it
    # read as "settled" and never got assist. v3 fixes that: if a foot has
    # stayed OUT of contact continuously for longer than
    # landing_assist_stuck_time_thresh, pull its ankle toward
    # landing_assist_land_pos (2.0 = default_joint_pos's own trained ankle
    # rest value, not a fit-from-data guess). Resets the instant contact is
    # regained. See plan doc for the full design history.
    # Disabled until verified; flip to true only after verify_locomotion.sh
    # + per-leg duty-cycle checks pass with it on.
    landing_assist_enabled: false
    landing_assist_land_pos: 2.0
    landing_assist_stuck_time_thresh: 0.5  # s; ~ a typical half-cycle at nominal cadence
    landing_assist_rate: 1.0               # rad/s, error-driven pull toward land_pos
    landing_assist_max_bias: 0.2           # rad hard cap; PD saturates ~0.026 rad anyway
    # Temporary calibration/diagnostic logger (see plan doc); not part of the
    # shipped behavior.
    debug_log_gait: false
    debug_log_path: "/tmp/gait_debug.csv"
