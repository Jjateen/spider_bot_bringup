# Big Bertha policy controller (C++ ONNX gait node).
#
# Trained contract (big_bertha_v1.1.0): obs = 52 floats, action = 12,
# joint_target = action_scale * action + default_joint_pos.
# Joint ORDER is Isaac tree-depth (hips, knees, ankles), NOT numeric:
#   [110,113,116,119, 111,114,117,120, 112,115,118,121]
# Numeric order scrambles obs/actions and collapses the robot. The
# /joint_states->obs map is by NAME; only this list's order matters.
# Gait clock obs[48:52]: see observation_builder.hpp; must reproduce
# big_bertha_env.py's _pre_physics_step/_get_observations exactly.
/**:
  ros__parameters:
    # Absolute path is supplied by the launch file (package share /models).
    model_path: ""
    action_scale: 0.25
    # Swing amplitude per physical group. The coxa keeps action_scale.
    #
    # Why per group: the exported policy SATURATES action_clip on all twelve
    # joints, 100% of samples, at every command in the envelope. It carries
    # phase only, never amplitude, so the joint target is a fixed-size square
    # wave and these scales ARE the gait amplitude. Nothing downstream can add
    # it back: smoothing is worth ~8% and max_joint_rate_rad_s above 3.0 is
    # worth nothing, because the limiter already runs saturated.
    #
    # The three groups are not interchangeable. Foot lift per radian at the
    # default stance, and worst-case servo margin per group:
    #   idx 0-3  arm_a  coxa    0.0 mm/rad   10.8 deg  (also carries steer_cmd)
    #   idx 4-7  arm_b  THIGH -50.3 mm/rad   43.3 deg  <- the lifter
    #   idx 8-11 arm_c  shin  +25.6 mm/rad    7.0 deg
    # The coxa axis is exactly vertical, so it cannot lift at any angle, only
    # sweep. A uniform raise is blocked by the shin at 7 deg while leaving the
    # thigh's 43 deg unused, which is why these are separate.
    #
    # Delivered foot clearance above the plane the other three feet define,
    # through the full chain, raising the THIGH alone:
    #   thigh  forward   fwd+turn   thigh margin
    #   0.32    34.0 mm   34.6 mm     43.3 deg
    #   0.45    47.0 mm   45.1 mm     35.9 deg   <- here, +38% / +30%
    #   0.60    61.5 mm      -        27.3 deg
    # Raising the coxa instead was measured and rejected: 0.25 -> 0.33 moved
    # foot sweep 98 -> 100 mm and clearance not at all, for a third of its
    # margin. Yaw comes from steer_max, not from coxa swing.
    thigh_action_scale: 0.45
    shin_action_scale: 0.32
    control_rate: 50.0       # Hz
    start_enabled: true
    cmd_vel_timeout: 0.5     # s; stale /cmd_vel -> command zeroed (safe stop)
    joint_limit: 3.14159     # rad; full ±180deg for MG995, raised from 1.57 to not clip training ankle default (2.00 rad)
    # PD lives in JointEffortPdController (ros2_control.yaml): synchronous,
    # zero-latency q/qd. PD here over a topic damps stale velocity -> jitter.
    #
    # Keep this false on hardware and do not add a PID here. MG995 is a POSITION
    # servo: it closes its own loop inside the case, you hand it a pulse width
    # and its electronics drive the horn to that angle and hold it. No torque or
    # current input is exposed, so an effort loop here has nothing to act on --
    # it would compute a torque and then throw it away at the PWM conversion.
    # JointEffortPdController is sim-only on purpose: the Gazebo joint has no
    # internal controller, so it has to fake the one the real servo already has.
    # Running it on hardware means two loops fighting each other.
    use_effort: false        # publish position targets, controller does the PD
    pd_rate: 200.0           # Hz; target publish rate (policy decimated to 50)
    action_clip: 1.0         # raw policy action clamp (matches env)
    # Trained command envelope. max_yaw_rate must stay at heading_max (0.5):
    # 0.35 was tested and FAILED (turn fell 0.279 -> 0.114 rad/s) -- the plant,
    # not the command, is binding.
    max_lin_vel_x: 0.3
    max_lin_vel_y: 0.06
    max_yaw_rate: 0.5
    # Heading-hold: yaw = wz + heading_kp*(desired_yaw - odom_yaw); rejects the
    # systematic DART contact yaw drift without retraining.
    heading_hold: true
    heading_kp: 2.0          # P gain on the (weak) policy yaw command
    heading_max: 0.5         # final yaw clamp = trained |yaw| <= 0.5
    heading_err_clamp: 0.4   # anti-windup: max setpoint lead/lag vs measured
    fwd_slow_err: 0.5        # |err| (rad) for forward throttle (off below)
    fwd_min_scale: 1.0       # 1.0 = no extra throttle; hip-steer does the trade
    # Hip-bias steering: uniform negative bias cancels the right drift
    # (calibrated: b=-0.25 took yaw -0.086 -> +0.002), hence all signs -1.
    steer_kp: 1.8            # rad of hip bias per rad of heading error
    steer_ki: 0.8            # removes the steady heading offset vs drift
    # max |hip bias|. This saturates during any sustained turn: err pins at
    # heading_err_clamp 0.4 and steer_i winds to steer_max/steer_ki = 0.325, so
    # the PI demands 1.8*0.4 + 0.8*0.325 = 0.98 rad and gets 0.26, i.e. 27% of
    # demand. It is therefore the next knob if turning is still weak after
    # rotate_to_heading_angular_vel went back to 0.5. Servo margin on the worst
    # hip (Revolute_116, lower limit 50 deg), including a full +-action_scale
    # swing on top of the bias:
    #   0.26 -> 10.8 deg   0.30 -> 8.5   0.35 -> 5.6   0.40 -> 2.8   0.45 clips
    # Raise it alone, one step at a time: more hip bias also distorts the
    # stance, so a gain in yaw is not guaranteed and has to be measured.
    # 0.26 -> 0.32. This saturates during any sustained turn (err pins at
    # heading_err_clamp 0.4, steer_i winds to steer_max/steer_ki, so the PI
    # demands ~0.98 rad and gets this), and it is the ONLY yaw lever: coxa
    # swing was measured and moves foot sweep 2% for a third of its margin.
    # Servo margin on the worst coxa (Revolute_116, lower limit 50 deg),
    # including a full action_scale swing on top of the bias:
    #   0.26 -> 10.8 deg   0.32 -> 7.3   0.35 -> 5.6   0.40 -> 2.8   0.45 clips
    # 7.3 deg matches what the shin already runs at. Go further only on a
    # measured turn rate, since more bias also distorts the stance.
    steer_max: 0.32
    steer_rate_limit: 0.01   # rad/step at 50 Hz (0.5 rad/s) — prevents sudden hip jerks
    hip_steer_sign: [-1.0, -1.0, -1.0, -1.0]
    # Lateral-hold: vy = clamp(-lateral_kp*line_offset); holds the LINE, not
    # just the heading. A/B post armature fix: forward 1:1 (0.136 m/s), crab
    # cut ~4x to ~0.005 m/s. Default ON.
    lateral_hold: true
    lateral_kp: 0.6
    # Re-latch only on a deliberate turn (0.05 -> 0.25: RPP's small
    # path-following wz kept resetting the reference every cycle).
    lateral_turn_thresh: 0.25
    # Cross-track steering: line offset -> heading bias, so the strong hip-bias
    # steering pulls back to the line.
    lateral_yaw_kp: 0.4     # rad of heading bias per metre of offset
    lateral_yaw_max: 0.3    # max |cross-track bias| (rad)
    # Gate the gait below this vx (the policy walks even at vx=0).
    stand_vx_thresh: 0.02
    # Hold the latched heading while gated/idle (contact creep pivots the
    # stance ~15 deg otherwise).
    station_keep: true
    joint_names:
      - Revolute_110   # idx0  hip  leg4 (back-left)
      - Revolute_113   # idx1  hip  leg1 (front-left)
      - Revolute_116   # idx2  hip  leg2 (front-right)
      - Revolute_119   # idx3  hip  leg3 (back-right)
      - Revolute_111   # idx4  knee leg4 (back-left)
      - Revolute_114   # idx5  knee leg1 (front-left)
      - Revolute_117   # idx6  knee leg2 (front-right)
      - Revolute_120   # idx7  knee leg3 (back-right)
      - Revolute_112   # idx8  ankle leg4 (back-left)
      - Revolute_115   # idx9  ankle leg1 (front-left)
      - Revolute_118   # idx10 ankle leg2 (front-right)
      - Revolute_121   # idx11 ankle leg3 (back-right)
    default_joint_pos:
      [0.0, 0.0, 0.0, 0.0,
       -0.32, -0.32, -0.32, -0.32,
       2.00, 2.00, 2.00, 2.00]
    # Gait clock: must match big_bertha_env.py's wave-gait phase exactly.
    gait_frequency: 0.667
    turn_clock_boost: 0.8
    speed_clock_boost: 1.1
    # Trained cadence ceiling, NOT a tuning knob. Arc A/B, 2.9 vs 2.1:
    # vx 0.104 -> 0.150 m/s (+44%), wz 0.016 -> 0.076 rad/s (4.7x).
    gait_boost_max: 2.1
    gait_offsets: [0.0, 0.5, 0.25, 0.75]   # legs 1/2/3/4 = arm_c_1_1..arm_c_4_1
