name: hardware_bridge_app
description: "Drives PCA9685 servos and reads MPU6050 IMU via Bridge RPC from the ROS 2 hardware_bridge_node"
icon: 🕷️
version: "0.1.0"
ports:
  - 50007
bricks:
  - id: python-relay
    type: python
    path: python/
    file: app.py
  - id: mcu-firmware
    type: sketch
    path: sketch/
    file: sketch.ino
